[package]
name = "rediensiam-client"
version = "0.1.0"
edition = "2021"
description = "Resource-server client for RediensIAM: live token introspection (RFC 7662) and permission checks."
license = "MIT"
keywords = ["iam", "oauth2", "authentication", "authorization"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
