{{/*
Skipped entirely when secrets.existingSecret names a Secret the operator manages — under
GitOps that Secret is a SealedSecret, and rendering this one too would give Argo CD and the
sealed-secrets controller the same object to own, each overwriting the other forever.
*/}}
{{- if not .Values.rediensiam.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  database-url:      {{ .Values.rediensiam.secrets.databaseUrl | quote }}
  totp-key:          {{ .Values.rediensiam.secrets.encryptionKey | quote }}
  # S-10 key rotation. When non-empty this supersedes totp-key: "id:hex,id:hex", first entry
  # active, every entry able to decrypt. Same ordering convention as Hydra's secrets.system.
  # Leave empty until you actually rotate — empty means "totp-key is key id 1", which is
  # byte-for-byte the pre-rotation behaviour.
  encryption-keys:   {{ .Values.rediensiam.secrets.encryptionKeys | default "" | quote }}
  smtp-password:     {{ .Values.rediensiam.secrets.smtpPassword | quote }}
  bootstrap-email:   {{ .Values.rediensiam.secrets.bootstrapEmail | default "" | quote }}
  bootstrap-password: {{ .Values.rediensiam.secrets.bootstrapPassword | default "" | quote }}
  argon2-pepper:     {{ .Values.rediensiam.security.argon2Pepper | default "" | quote }}
  # S-10. Same shape as encryption-keys but for the Argon2 pepper. Password hashes cannot be
  # swept — they re-pepper one successful login at a time — so the tail here is long and the
  # old pepper must stay listed until you accept locking out whoever has not signed in.
  argon2-peppers:    {{ .Values.rediensiam.security.argon2Peppers | default "" | quote }}
  # T-04. `postgres-password` is the bootstrap SUPERUSER (`iam`). Nothing at runtime uses it
  # any more — it exists for initdb and for break-glass maintenance. The four below are the
  # per-component least-privilege roles that replaced it.
  postgres-password: {{ .Values.rediensiam.postgres.local.password | quote }}
  postgres-app-password:    {{ .Values.rediensiam.postgres.local.roles.appPassword | quote }}
  postgres-hydra-password:  {{ .Values.rediensiam.postgres.local.roles.hydraPassword | quote }}
  postgres-keto-password:   {{ .Values.rediensiam.postgres.local.roles.ketoPassword | quote }}
  postgres-backup-password: {{ .Values.rediensiam.postgres.local.roles.backupPassword | quote }}
{{- end }}
