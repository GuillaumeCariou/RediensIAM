{{- if .Values.rediensiam.dragonfly.local.enabled }}
{{- if .Values.rediensiam.dragonfly.local.tls.enabled }}
# Cache transport encryption. Unlike Postgres this is a HARD cutover — with --tls Dragonfly
# stops answering cleartext — so the cacheUrl secret must gain `ssl=true` in the same change.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-dragonfly-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ .Release.Name }}-dragonfly-tls
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
  commonName: {{ .Release.Name }}-dragonfly
  dnsNames:
    - {{ .Release.Name }}-dragonfly
    - {{ .Release.Name }}-dragonfly.{{ .Release.Namespace }}.svc
    - {{ .Release.Name }}-dragonfly.{{ .Release.Namespace }}.svc.cluster.local
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dragonfly
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-dragonfly
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dragonfly
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-dragonfly
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-dragonfly
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        {{- if .Values.rediensiam.dragonfly.local.tls.enabled }}
        fsGroup: 999    # so uid 999 can read the mounted key
        {{- end }}
      containers:
        - name: dragonfly
          image: {{ .Values.rediensiam.dragonfly.local.image }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: DRAGONFLY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: dragonfly-password
          ports:
            - containerPort: 6379
          args:
            - --logtostderr
            - --requirepass=$(DRAGONFLY_PASSWORD)
            {{- if .Values.rediensiam.dragonfly.local.tls.enabled }}
            - --tls
            - --tls_cert_file=/etc/dragonfly-tls/tls.crt
            - --tls_key_file=/etc/dragonfly-tls/tls.key
            {{- end }}
          {{- if .Values.rediensiam.dragonfly.local.tls.enabled }}
          volumeMounts:
            - name: tls
              mountPath: /etc/dragonfly-tls
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.rediensiam.dragonfly.local.resources | nindent 12 }}
      {{- if .Values.rediensiam.dragonfly.local.tls.enabled }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Release.Name }}-dragonfly-tls
            defaultMode: 0440
      {{- end }}
{{- end }}
