{{- if .Values.rediensiam.postgres.local.enabled }}
{{- if .Values.rediensiam.postgres.local.tls.enabled }}
# R-15. Server-side TLS for the bundled Postgres. Signed by the `selfsigned` ClusterIssuer,
# so `sslmode=require` (encryption, no server authentication) is the honest ceiling here;
# `verify-full` needs a real CA whose root is distributed to app, Hydra and Keto — see the
# R-15 runbook. Postgres with ssl=on still ACCEPTS cleartext clients: it is the sslmode in
# each DSN that enforces the encrypted path, which is why this can be enabled without an
# outage and switched over per-client.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-postgres-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ .Release.Name }}-postgres-tls
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
  commonName: {{ .Release.Name }}-postgres
  dnsNames:
    - {{ .Release.Name }}-postgres
    - {{ .Release.Name }}-postgres.{{ .Release.Namespace }}.svc
    - {{ .Release.Name }}-postgres.{{ .Release.Namespace }}.svc.cluster.local
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgres-init
  namespace: {{ .Release.Namespace }}
data:
  init.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "postgres" <<-EOSQL
      CREATE DATABASE hydra;
      CREATE DATABASE keto;
      GRANT ALL PRIVILEGES ON DATABASE hydra TO $POSTGRES_USER;
      GRANT ALL PRIVILEGES ON DATABASE keto TO $POSTGRES_USER;
    EOSQL
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: {{ .Release.Name }}-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-postgres
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70           # alpine postgres user
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.rediensiam.postgres.local.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # postgres writes to /tmp, /var/run; keep RW for simplicity
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_USER
              value: iam
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              value: postgres
          {{- if .Values.rediensiam.postgres.local.tls.enabled }}
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgres-tls/tls.crt
            - -c
            - ssl_key_file=/etc/postgres-tls/tls.key
          {{- end }}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            {{- if .Values.rediensiam.postgres.local.tls.enabled }}
            - name: tls
              mountPath: /etc/postgres-tls
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.rediensiam.postgres.local.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "iam", "-d", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init
          configMap:
            name: {{ .Release.Name }}-postgres-init
            defaultMode: 0755
        {{- if .Values.rediensiam.postgres.local.tls.enabled }}
        # 0640 with root ownership is the only mode Postgres accepts for a key it does not
        # own; fsGroup 70 above makes it group-readable by the postgres user.
        - name: tls
          secret:
            secretName: {{ .Release.Name }}-postgres-tls
            defaultMode: 0640
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.rediensiam.postgres.local.storage }}
{{- end }}
