{{- if .Values.rediensiam.ingress.admin.enabled }}
# Private admin ingress — Tailscale only (auth.ts.rediens.net).
# Issuer is configurable (ingress.admin.tls.clusterIssuer names a ClusterIssuer you run). Empty
# falls back to the chart's own self-signed Issuer, which produces a browser warning on the
# most privileged UI in the deployment and so trains operators to click through certificate
# errors — see the R-05 runbook in SECURITY-AUDIT-LOG.md step 09.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-admin-internal
  namespace: {{ .Release.Namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: {{ .Values.rediensiam.ingress.admin.entrypoints }}
    {{- if .Values.rediensiam.ingress.admin.tls.enabled }}
    {{- if .Values.rediensiam.ingress.admin.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.rediensiam.ingress.admin.tls.clusterIssuer }}
    {{- else }}
    cert-manager.io/issuer: {{ include "rediensiam.selfSignedIssuer" . }}
    {{- end }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.rediensiam.ingress.className }}
  {{- if .Values.rediensiam.ingress.admin.tls.enabled }}
  tls:
    - hosts:
        - {{ include "rediensiam.ingressAdminHost" . }}
      secretName: {{ .Release.Name }}-admin-tls
  {{- end }}
  rules:
    - host: {{ include "rediensiam.ingressAdminHost" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-admin
                port:
                  number: {{ .Values.rediensiam.service.admin.port }}
{{- end }}
