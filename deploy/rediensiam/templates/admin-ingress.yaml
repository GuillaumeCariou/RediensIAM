{{- if .Values.rediensiam.ingress.admin.enabled }}
# Private admin ingress — Tailscale only (auth.ts.rediens.net).
# Issuer is configurable (ingress.admin.clusterIssuer). The `selfsigned` default produces a
# browser warning on the most privileged UI in the deployment, which trains operators to
# click through certificate errors — see the R-05 runbook in .security-hardening/09.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-admin-internal
  namespace: {{ .Release.Namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: {{ .Values.rediensiam.ingress.admin.clusterIssuer }}
spec:
  ingressClassName: {{ .Values.rediensiam.ingress.className }}
  tls:
    - hosts:
        - {{ include "rediensiam.ingressAdminHost" . }}
      secretName: {{ .Release.Name }}-admin-tls
  rules:
    - host: {{ include "rediensiam.ingressAdminHost" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-admin
                port:
                  number: {{ .Values.rediensiam.service.admin.port }}
{{- end }}
