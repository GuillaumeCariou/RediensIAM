# ── Prod environment overrides ────────────────────────────────────────────────
# Layered on top of values.yaml. Secrets in values.prod.secret.yaml (gitignored).
# Admin SPA accessible via Tailscale mesh (100.64.0.3) — no public hostname.

rediensiam:
  publicUrl: "https://auth.rediens.net"
  adminUrl:  "https://auth.ts.rediens.net"    # Tailscale MagicDNS — Tailscale-only

  # R-05. No NodePort in prod: the admin surface is reached only through the Tailscale-only
  # admin ingress below. This is what the values.yaml comment used to claim NodePort provided.
  service:
    admin:
      type: ClusterIP

  ingress:
    public:
      # R-02. Requires a ClusterIssuer named below to exist. Either install cert-manager and
      # set certManager.acme.enabled + email (renders a Let's Encrypt ClusterIssuer with an
      # HTTP-01 solver), or point clusterIssuer at an issuer you already run.
      tls:
        enabled: true
        clusterIssuer: letsencrypt
    admin:
      enabled: true
      host: "auth.ts.rediens.net"
      # Still self-signed: nothing here can certify a headscale-issued name. The runbook in
      # .security-hardening/09-infra-security.md gives the two ways to fix that; until one is
      # done, this is a known click-through warning on the most privileged UI.
      clusterIssuer: selfsigned

  # R-15. Prod already requires cert-manager for the two ingress certs above, so the
  # database certificate costs no new dependency. requireSsl makes pg_hba.conf admit
  # `hostssl` only; deploy.sh writes matching DSNs on a fresh install because it
  # greps this file for `requireSsl: true` before generating them.
  #
  # NOT YET RUN AGAINST A REAL PROD DATABASE — prod has never been deployed from this
  # branch. On a FRESH install this is correct and self-consistent. On an EXISTING
  # prod database it is a migration, not an upgrade: pg_hba.conf is written by initdb
  # and a chart upgrade will not rewrite it. Follow §2 of
  # .security-hardening/18-cnpg-tls-rls.md before the first upgrade that carries this.
  postgres:
    local:
      tls:
        enabled: true
        requireSsl: true

  # cert-manager must already be installed in the cluster; this chart does not install it.
  certManager:
    acme:
      enabled: false          # set true + email to issue a real cert for auth.rediens.net
      email: ""

  smtp:
    host: ""                             # set your SMTP server
    port: 587
    startTls: true
    username: ""                         # set your SMTP login
    fromAddress: "noreply@rediens.net"
    fromName: "Rediens"

hydra:
  hydra:
    dev: false
    dangerousForceHttp: false
    config:
      urls:
        self:
          issuer:              "https://auth.rediens.net"
        login:                 "https://auth.rediens.net/login"
        consent:               "https://auth.rediens.net/auth/consent"
        logout:                "https://auth.rediens.net/auth/logout"
        post_logout_redirect:  "https://auth.ts.rediens.net/admin/"
      serve:
        public:
          cors:
            enabled: true
            allowed_origins:
              # R-19 / chain C-9: `http://localhost:30501` is gone. It made port 30501 on ANY
              # operator workstation a trusted origin against the production OAuth2 endpoints,
              # permanently, for an SSH-tunnel convenience. The tunnel it existed for is also
              # gone now that prod uses ClusterIP + the Tailscale admin ingress; reach the
              # console at https://auth.ts.rediens.net/admin/ over Tailscale instead.
              - "https://auth.ts.rediens.net"
