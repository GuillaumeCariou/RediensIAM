# ── Dev environment overrides ─────────────────────────────────────────────────
# Layered on top of values.yaml. Secrets in values.secret.yaml (gitignored).

rediensiam:
  publicUrl: "http://iam.localhost"
  adminUrl:  "http://localhost:30501"

  service:
    admin:
      # DEV ONLY. The chart default is ClusterIP (R-05); dev opts back in because the admin
      # SPA is reached at http://localhost:30501 with no ingress and no DNS name. A NodePort
      # binds on every node interface, so on a laptop this is loopback plus the LAN address —
      # acceptable on a dev box, never on a deployed node. Prod does not set this.
      type: NodePort

  # R-15, live on this cluster since 2026-07-31. cert-manager v1.21.1 is installed
  # (namespace `cert-manager`) and the bundled Postgres serves TLS 1.3 from a
  # `selfsigned`-issued Certificate. requireSsl means pg_hba.conf admits `hostssl`
  # only, so cleartext is refused by the server rather than merely unused.
  #
  # These are NOT chart defaults: an install without cert-manager cannot render the
  # Certificate at all. They live here because this cluster has it and because the
  # alternative — carrying the state only in `helm --set` — is exactly the
  # "deployed ≠ repository" drift step 12 exists to catch. Turning them off on an
  # already-migrated database is an outage: pg_hba.conf lives on the PVC and still
  # says hostssl.
  #
  postgres:
    local:
      tls:
        enabled: true
        requireSsl: true

    # S-5 phase 2, on since step 29. The application half shipped in step 21
    # (src/Data/TenantScopeInterceptor.cs sets `rediensiam.org_id` on every
    # connection open), which is what makes these fail-closed policies survivable.
    #
    # `ALTER ROLE iam_backup BYPASSRLS` is a hard prerequisite — pg_dump sets
    # row_security=off, which ERRORS for a role that cannot bypass, so without it
    # the nightly backup stops. init.sh grants it at initdb when this flag is set,
    # and files/rls.sql refuses to apply a single policy without it, so neither a
    # fresh install nor an existing database can miss it silently.
    rls:
      enabled: true

  # Cache TLS, on since step 23. Step 18 stopped here because the client could not trust a
  # cert-manager root; src/Config/CacheTls.cs now pins to the CA the app Deployment mounts at
  # /etc/cache-tls/ca.crt, so the connection is both encrypted and authenticated.
  #
  # Unlike Postgres this is not a preference the DSN can decline: --tls makes Dragonfly stop
  # answering cleartext, so deploy.sh writes `,ssl=true` into cacheUrl from this same flag and
  # templates/dragonfly.yaml fails the render if the two ever disagree in either direction.
  dragonfly:
    local:
      tls:
        enabled: true

  ingress:
    public:
      tls:
        # `iam.localhost` cannot be certified by any CA and k3s Traefik would fall back to its
        # own default cert, so dev stays on cleartext. This is the one place R-02 is not fixed,
        # and it is gated to dev precisely so prod cannot inherit it.
        enabled: false

  smtp:
    fromAddress: "noreply@localhost"
    fromName: "RediensIAM"

hydra:
  hydra:
    dev: true
    dangerousForceHttp: true
    config:
      urls:
        self:
          issuer:              "http://iam.localhost"
        login:                 "http://iam.localhost/login"
        consent:               "http://iam.localhost/auth/consent"
        # A browser redirect target, so it must be a page. It pointed at /auth/logout, which is
        # the JSON controller behind this page — the browser landed on the raw challenge body and
        # nothing ever accepted the request, so the session outlived the sign-out.
        logout:                "http://iam.localhost/logout"
        post_logout_redirect:  "http://localhost:30501/admin/"
        error:                 "http://iam.localhost/auth/oauth2/error"
      serve:
        public:
          cors:
            enabled: true
            allowed_origins:
              - "http://localhost:30501"
