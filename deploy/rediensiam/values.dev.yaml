# ── Dev environment overrides ─────────────────────────────────────────────────
# Layered on top of values.yaml. Secrets in values.secret.yaml (gitignored).

rediensiam:
  publicUrl: "http://iam.localhost"
  # A subdomain of the issuer's host, and that is the point. The console used to be reached at
  # http://localhost:30501, which is a *different site* from iam.localhost as browsers count them:
  # the registrable domain of iam.localhost is iam.localhost, and localhost is its own. Hydra's
  # session cookie is SameSite=Strict, so it was never sent when the console started an
  # authorization request — Hydra saw no session, could not skip, and asked for the password again
  # on every reload. Ory's own documentation is explicit about this: "Ory APIs must be exposed on
  # the same domain as your application. If you don't fulfill this requirement, HTTP Cookies are
  # ignored by the browser." The production profile already satisfies it — its console host is a
  # subdomain of the issuer's registrable domain — and dev now mirrors that shape.
  adminUrl:  "http://admin.iam.localhost"

  service:
    admin:
      # DEV ONLY, and now only a troubleshooting door. The console is reached at
      # http://admin.iam.localhost/console/ through the admin ingress above. This NodePort still
      # answers on :30501, but only to a request carrying `Host: admin.iam.localhost` — the app
      # accepts the hosts this deployment declares and nothing else, so a bare
      # http://localhost:30501 is refused with a 400. That is host filtering working.
      # The chart default is ClusterIP (R-05): a NodePort binds on every node interface, so on a
      # laptop this is loopback plus the LAN address — fine on a dev box, never on a deployed node.
      # Prod does not set this.
      type: NodePort

  # R-15, live on this cluster since 2026-07-31. cert-manager v1.21.1 is installed
  # (namespace `cert-manager`) and the bundled Postgres serves TLS 1.3 from a
  # `selfsigned`-issued Certificate. requireSsl means pg_hba.conf admits `hostssl`
  # only, so cleartext is refused by the server rather than merely unused.
  #
  # These are NOT chart defaults: an install without cert-manager cannot render the
  # Certificate at all. They live here because this cluster has it and because the
  # alternative — carrying the state only in `helm --set` — is exactly the
  # "deployed ≠ repository" drift step 12 exists to catch. Turning them off on an
  # already-migrated database is an outage: pg_hba.conf lives on the PVC and still
  # says hostssl.
  #
  postgres:
    local:
      tls:
        enabled: true
        requireSsl: true

    # S-5 phase 2, on since step 29. The application half shipped in step 21
    # (src/Data/TenantScopeInterceptor.cs sets `rediensiam.org_id` on every
    # connection open), which is what makes these fail-closed policies survivable.
    #
    # `ALTER ROLE iam_backup BYPASSRLS` is a hard prerequisite — pg_dump sets
    # row_security=off, which ERRORS for a role that cannot bypass, so without it
    # the nightly backup stops. init.sh grants it at initdb when this flag is set,
    # and files/rls.sql refuses to apply a single policy without it, so neither a
    # fresh install nor an existing database can miss it silently.
    rls:
      enabled: true

  hydra:
    dev: true
    dangerousForceHttp: true
    config:
      urls:
        self:
          issuer:              "http://iam.localhost"
        login:                 "http://iam.localhost/login"
        consent:               "http://iam.localhost/auth/consent"
        # A browser redirect target, so it must be a page. It pointed at /auth/logout, which is
        # the JSON controller behind this page — the browser landed on the raw challenge body and
        # nothing ever accepted the request, so the session outlived the sign-out.
        logout:                "http://iam.localhost/logout"
        post_logout_redirect:  "http://localhost:30501/console/"
        error:                 "http://iam.localhost/auth/oauth2/error"
      serve:
        public:
          cors:
            enabled: true
            allowed_origins:
              # The console's origin, which is where the SDK fetches /.well-known/openid-configuration
              # from. It must track adminUrl: pointing it at the old NodePort origin left the
              # console with a CORS failure on discovery and a blank page, the browser's only
              # account of it being one console error.
              - "http://admin.iam.localhost"
