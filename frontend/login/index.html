<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <!--
      Mirrors the server header (src/Program.cs, AddSecurityHeaders); browsers enforce the
      intersection. connect-src is 'self': this SPA only ever calls the origin that served it.
      frame-ancestors is not repeated — browsers ignore it in a meta tag; the header carries it.
      Fonts are self-hosted (@fontsource-variable/geist) — no external origin to allow.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; frame-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" />
    <title>RediensIAM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
